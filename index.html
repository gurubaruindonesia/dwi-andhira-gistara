     <!-- SCRIPTS IMPLEMENTATION -->
     <script>
         // GLOBAL VARIABLES & STATES
         let currentTimer = null;
         let timerSeconds = 60;
+        let initialTimerSeconds = 60;
         let isTimerRunning = false;

         let mediaRecorder = null;
         let audioChunks = [];
         let voiceTimerInterval = null;
         let voiceSeconds = 0;
+        let currentUserRole = 'guest';

+        // Sesi Absensi & Database
+        let activeAttendanceSession = {
+            title: "Latihan Debat & MC Mingguan SPENTWO",
+            date: new Date().toISOString().split('T')[0],
+            startTime: "14:00",
+            endTime: "17:00",
+            isOpen: true
+        };

         // Timer Duration Switcher (1, 3, 5 Mins)
         window.setTimerDuration = function(mins) {
+            clearInterval(currentTimer);
+            isTimerRunning = false;
+            document.getElementById('ai-timer-control').innerText = "▶ Mulai Latihan";
+            
+            initialTimerSeconds = mins * 60;
+            timerSeconds = initialTimerSeconds;
+            
+            // Update Display
+            const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
+            const s = String(timerSeconds % 60).padStart(2, '0');
+            document.getElementById('ai-timer-display').innerText = `${m}:${s}`;

+            // Highlight Button State
            [1, 3, 5].forEach(num => {
                const btn = document.getElementById(`timer-btn-${num}`);
                if (btn) {
                    if (num === mins) {
                        btn.className = "px-4 py-2 bg-gold-400 text-teal-950 font-bold rounded-xl text-sm shadow transition-all";
                    } else {
                        btn.className = "px-4 py-2 bg-teal-800 text-teal-200 border border-teal-700 rounded-xl text-sm font-bold shadow hover:bg-teal-700 transition-all";
                    }
                }
            });
        };

        // Voice Recorder Logic Fix
        window.toggleVoiceRecording = async function() {
            const btn = document.getElementById('btn-record-voice');
            const label = document.getElementById('btn-record-label');
            const recDot = document.getElementById('rec-dot');
            const timerText = document.getElementById('voice-timer');
            const audioPlayback = document.getElementById('audio-playback');

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        audioPlayback.src = audioUrl;
                        audioPlayback.load();
                        
                        // Stop all mic tracks
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    voiceSeconds = 0;
                    timerText.innerText = "00:00";
                    timerText.classList.remove('hidden');
                    recDot.style.display = 'inline-block';
                    label.innerText = '⏹ Hentikan Rekaman Suara';
                    btn.className = "px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-teal-950 font-bold rounded-xl text-sm shadow flex items-center gap-2 transition-all";

                    voiceTimerInterval = setInterval(() => {
                        voiceSeconds++;
                        const m = String(Math.floor(voiceSeconds / 60)).padStart(2, '0');
                        const s = String(voiceSeconds % 60).padStart(2, '0');
                        timerText.innerText = `${m}:${s}`;
                    }, 1000);

                } catch (err) {
                    alert('Akses mikrofon dibutuhkan untuk fitur ini. Izinkan mikrofon di browser HP/Laptop Anda.');
                }
            } else if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                clearInterval(voiceTimerInterval);
                recDot.style.display = 'none';
                label.innerText = '🎙️ Mulai Rekam Suara Baru';
                btn.className = "px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl text-sm shadow flex items-center gap-2 transition-all";
            }
        };

        // Attendance Actions for Student & Teacher
        window.doSelfAttendance = function() {
            if (!activeAttendanceSession.isOpen) {
                alert('Maaf, sesi absensi saat ini sedang ditutup oleh Pembina.');
                return;
            }
            const nama = prompt("Masukkan Nama Lengkap Anda untuk Presensi:", "Siswa Spentwo");
            if (nama) {
                alert(`Terima kasih ${nama}, presensi kehadiran Anda pada sesi "${activeAttendanceSession.title}" berhasil dicatat!`);
            }
        };

        window.openAddSessionModal = function() {
            const title = prompt("Masukkan Judul Sesi Absensi Baru (Pembina):", "Latihan Public Speaking");
            const start = prompt("Jam Mulai Buka (WITA):", "14:00");
            const end = prompt("Jam Batas Selesai (WITA):", "17:00");
            if (title && start && end) {
                activeAttendanceSession.title = title;
                activeAttendanceSession.startTime = start;
                activeAttendanceSession.endTime = end;
                activeAttendanceSession.isOpen = true;

                document.getElementById('session-title-display').innerText = title;
                document.getElementById('session-time-display').innerHTML = `Waktu Absen: ${start} - ${end} WITA | Status: <span class="text-emerald-400 font-bold">Terbuka</span>`;
                alert('Sesi absensi baru berhasil diterbitkan untuk seluruh siswa!');
            }
        };

        // Login Handler update for UI Role Customization
        const originalHandleLogin = window.handleLoginSubmit;
        window.handleLoginSubmit = function(e) {
            if (e) e.preventDefault();
            const u = document.getElementById('login-username').value;
            if (u === 'pembina') {
                currentUserRole = 'pembina';
                document.getElementById('btn-add-session').classList.remove('hidden');
            } else {
                currentUserRole = 'anggota';
                document.getElementById('btn-add-session').classList.add('hidden');
            }
            if (originalHandleLogin) originalHandleLogin(e);
        };
    </script>
